[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr-comments"
version = "1.0.0"
description = "Installable Agent Skills pack for pull request / merge request comment intelligence."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "framedparadox" }]
keywords = ["agent-skills", "pull-request", "code-review", "gitlab", "github"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/framedparadox/pr-comments"
Repository = "https://github.com/framedparadox/pr-comments"

[project.scripts]
pr-comments = "comment_intel.cli:main"
comment-intel = "comment_intel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/comment_intel"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "comment_intel/data/skills"

[tool.hatch.build.targets.sdist]
include = [
  "src/comment_intel",
  "skills",
  "tests",
  "README.md",
  "AGENTS.md",
  "pyproject.toml",
]
