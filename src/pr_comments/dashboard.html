<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PR comment archive</title>
  <style>
    :root {
      --bg: #0e1218;
      --bg-2: #161c25;
      --bg-3: #1e2733;
      --line: #2a3544;
      --text: #e8eef6;
      --muted: #8b98a8;
      --accent: #7dd3a0;
      --accent-2: #8ec8ff;
      --danger: #f87171;
      --bot: #c4b5fd;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--sans);
      background: radial-gradient(1200px 500px at 10% -10%, #1a2a22 0%, transparent 50%), var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: flex-end;
      padding: 28px 28px 16px;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 650; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 13px; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .stat {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      min-width: 92px;
    }
    .stat b { display: block; font-size: 18px; }
    .stat span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    .layout { display: grid; grid-template-columns: 280px 1fr 360px; height: calc(100% - 108px); }
    aside, main, .detail {
      overflow: auto;
    }
    aside {
      border-right: 1px solid var(--line);
      padding: 16px;
      background: rgba(14, 18, 24, 0.7);
    }
    label { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin: 14px 0 6px; }
    input, select {
      width: 100%;
      background: var(--bg-3);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--line);
      background: var(--bg-2);
      color: var(--text);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .chip.active { border-color: var(--accent); color: var(--accent); }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; position: sticky; top: 0; background: var(--bg); }
    tr { cursor: pointer; }
    tr:hover { background: var(--bg-2); }
    tr.selected { background: #1c2a24; }
    .who { font-weight: 600; }
    .who.deleted { color: var(--danger); }
    .who.bot { color: var(--bot); }
    .kind { font-family: var(--mono); font-size: 11px; color: var(--accent-2); }
    .snippet { color: var(--muted); max-width: 520px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sha { font-family: var(--mono); font-size: 11px; color: var(--accent); }
    .detail {
      border-left: 1px solid var(--line);
      padding: 18px;
      background: var(--bg-2);
    }
    .detail h2 { margin: 0 0 8px; font-size: 16px; }
    .meta { display: grid; grid-template-columns: 120px 1fr; gap: 6px 10px; font-size: 13px; margin: 16px 0; }
    .meta dt { color: var(--muted); }
    .body {
      white-space: pre-wrap;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      line-height: 1.45;
      box-shadow: var(--shadow);
    }
    a { color: var(--accent-2); }
    .empty { padding: 48px; color: var(--muted); text-align: center; }
    button.linkish {
      background: none;
      border: 0;
      color: var(--accent);
      cursor: pointer;
      font: inherit;
    }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 240px 1fr; }
      .detail { display: none; }
      .detail.open-mobile { display: block; position: fixed; inset: 12px; z-index: 5; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="title">PR comment archive</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <div class="layout">
    <aside>
      <label for="q">Search comments</label>
      <input id="q" placeholder="text, author, path, commit…" autofocus />
      <label for="author">Comment by</label>
      <select id="author"><option value="">Anyone</option></select>
      <label>Author type</label>
      <div class="chips" id="types"></div>
      <label>Kind</label>
      <div class="chips" id="kinds"></div>
      <label for="pr">Pull request</label>
      <select id="pr"><option value="">All PRs targeting base</option></select>
      <label for="from">Comment date from</label>
      <input id="from" type="date" />
      <label for="to">Comment date to</label>
      <input id="to" type="date" />
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="date-desc">Comment date (newest)</option>
        <option value="date-asc">Comment date (oldest)</option>
        <option value="pr">PR number</option>
        <option value="author">Comment by</option>
      </select>
    </aside>
    <main>
      <div class="toolbar">
        <div class="sub" id="count"></div>
        <button class="linkish" id="download" type="button">Download filtered CSV</button>
      </div>
      <div id="table-wrap"></div>
    </main>
    <section class="detail" id="detail">
      <p class="sub">Select a row to read the full comment, commit, and thread.</p>
    </section>
  </div>
  <script id="pr-comments-data" type="application/json">__PR_COMMENTS_DATA__</script>
  <script>
    const payload = JSON.parse(document.getElementById("pr-comments-data").textContent);
    const comments = payload.comments || [];
    const state = { q: "", author: "", type: "all", kind: "all", pr: "", from: "", to: "", sort: "date-desc", selected: null };

    document.getElementById("title").textContent = payload.repo + " — PR comments";
    document.getElementById("subtitle").textContent =
      (payload.host || "") + " · base `" + (payload.base_branch || "main") + "` · extracted " + (payload.extracted_at || "");

    const stats = payload.stats || {};
    document.getElementById("stats").innerHTML = [
      ["comments", stats.comments],
      ["PRs", stats.pull_requests],
      ["authors", stats.authors],
      ["deleted", stats.deleted_authors],
      ["bots", stats.bots],
      ["replies", stats.replies],
    ].map(([k, v]) => `<div class="stat"><b>${v ?? 0}</b><span>${k}</span></div>`).join("");

    const authorSel = document.getElementById("author");
    [...new Set(comments.map(c => c.comment_by).filter(Boolean))].sort().forEach(name => {
      const opt = document.createElement("option");
      opt.value = name; opt.textContent = name;
      authorSel.appendChild(opt);
    });
    const prSel = document.getElementById("pr");
    [...new Set(comments.map(c => c.pr_number).filter(n => n != null))].sort((a,b)=>a-b).forEach(n => {
      const opt = document.createElement("option");
      opt.value = String(n); opt.textContent = "#" + n;
      prSel.appendChild(opt);
    });

    function chips(el, values, key) {
      values.forEach(value => {
        const b = document.createElement("button");
        b.className = "chip" + (value === "all" ? " active" : "");
        b.type = "button";
        b.textContent = value;
        b.addEventListener("click", () => {
          state[key] = value;
          [...el.querySelectorAll(".chip")].forEach(x => x.classList.toggle("active", x.textContent === value));
          render();
        });
        el.appendChild(b);
      });
    }
    chips(document.getElementById("types"), ["all", "user", "bot", "deleted"], "type");
    chips(document.getElementById("kinds"), ["all", ...new Set(comments.map(c => c.comment_kind).filter(Boolean))], "kind");

    ["q","author","pr","from","to","sort"].forEach(id => {
      document.getElementById(id).addEventListener("input", e => {
        state[id === "q" ? "q" : id] = e.target.value;
        render();
      });
    });

    function hay(c) {
      return [c.comment, c.comment_by, c.path, c.commit_id, c.pr_title, c.pr_number, c.comment_kind].join(" ").toLowerCase();
    }
    function filtered() {
      const q = state.q.trim().toLowerCase();
      let rows = comments.filter(c => {
        if (q && !hay(c).includes(q)) return false;
        if (state.author && c.comment_by !== state.author) return false;
        if (state.type !== "all" && c.author_type !== state.type) return false;
        if (state.kind !== "all" && c.comment_kind !== state.kind) return false;
        if (state.pr && String(c.pr_number) !== state.pr) return false;
        const d = (c.comment_date || "").slice(0, 10);
        if (state.from && d && d < state.from) return false;
        if (state.to && d && d > state.to) return false;
        return true;
      });
      const sorters = {
        "date-desc": (a,b) => (b.comment_date || "").localeCompare(a.comment_date || ""),
        "date-asc": (a,b) => (a.comment_date || "").localeCompare(b.comment_date || ""),
        pr: (a,b) => (a.pr_number||0) - (b.pr_number||0) || (a.comment_date||"").localeCompare(b.comment_date||""),
        author: (a,b) => (a.comment_by||"").localeCompare(b.comment_by||""),
      };
      rows.sort(sorters[state.sort] || sorters["date-desc"]);
      return rows;
    }
    function esc(v) {
      return String(v ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch]));
    }
    function shortSha(v) { return v ? String(v).slice(0, 7) : "—"; }
    function snippet(v) { return String(v || "").replace(/\s+/g, " ").trim(); }

    function render() {
      const rows = filtered();
      document.getElementById("count").textContent = rows.length + " of " + comments.length + " comments";
      if (!rows.length) {
        document.getElementById("table-wrap").innerHTML = `<div class="empty">No comments match these filters.</div>`;
        return;
      }
      document.getElementById("table-wrap").innerHTML = `<table>
        <thead><tr>
          <th>PR</th><th>Comment by</th><th>Comment date</th><th>Commit</th><th>Kind</th><th>Comment</th>
        </tr></thead>
        <tbody>${rows.map(c => `<tr data-id="${esc(c.id)}">
          <td>#${esc(c.pr_number)}</td>
          <td class="who ${esc(c.author_type)}">${esc(c.comment_by)}${c.is_reply ? " <span class='kind'>reply</span>" : ""}</td>
          <td>${esc((c.comment_date || "").replace("T", " ").replace("Z", ""))}</td>
          <td class="sha">${esc(shortSha(c.commit_id))}</td>
          <td class="kind">${esc(c.comment_kind)}</td>
          <td class="snippet">${esc(snippet(c.comment))}</td>
        </tr>`).join("")}</tbody></table>`;
      document.querySelectorAll("tbody tr").forEach(tr => {
        tr.addEventListener("click", () => {
          state.selected = tr.getAttribute("data-id");
          document.querySelectorAll("tbody tr").forEach(x => x.classList.toggle("selected", x === tr));
          show(comments.find(c => c.id === state.selected));
        });
      });
    }

    function show(c) {
      if (!c) return;
      const thread = comments.filter(x => x.thread_id && x.thread_id === c.thread_id && x.pr_number === c.pr_number)
        .sort((a,b) => (a.comment_date||"").localeCompare(b.comment_date||""));
      document.getElementById("detail").innerHTML = `
        <h2>${esc(c.comment_by)} on #${esc(c.pr_number)}</h2>
        <div class="sub">${esc(c.pr_title || "")}</div>
        <dl class="meta">
          <dt>Comment by</dt><dd class="who ${esc(c.author_type)}">${esc(c.comment_by)} (${esc(c.author_type)})</dd>
          <dt>Comment date</dt><dd>${esc(c.comment_date)}</dd>
          <dt>PR created</dt><dd>${esc(c.pr_created_at)}</dd>
          <dt>Commit</dt><dd class="sha">${esc(c.commit_id || "—")}</dd>
          <dt>Original commit</dt><dd class="sha">${esc(c.original_commit_id || "—")}</dd>
          <dt>Kind</dt><dd>${esc(c.comment_kind)}${c.path ? " · " + esc(c.path) + (c.line ? ":" + esc(c.line) : "") : ""}</dd>
          <dt>Links</dt><dd>${c.comment_url ? `<a href="${esc(c.comment_url)}" target="_blank" rel="noreferrer">comment</a>` : "—"}
            ${c.pr_url ? ` · <a href="${esc(c.pr_url)}" target="_blank" rel="noreferrer">pull request</a>` : ""}</dd>
        </dl>
        <div class="body">${esc(c.comment)}</div>
        ${thread.length > 1 ? `<label style="margin-top:18px">Thread (${thread.length})</label>` +
          thread.map(t => `<p class="sub"><b class="who ${esc(t.author_type)}">${esc(t.comment_by)}</b> · ${esc(t.comment_date)}<br>${esc(snippet(t.comment))}</p>`).join("") : ""}
      `;
    }

    document.getElementById("download").addEventListener("click", () => {
      const rows = filtered();
      const fields = ["repo","pr_number","pr_title","pr_created_at","commit_id","comment_date","comment_by","author_type","comment_kind","comment","comment_url"];
      const escCsv = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      const csv = [fields.join(",")].concat(rows.map(r => fields.map(f => escCsv(r[f])).join(","))).join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (payload.repo || "pr-comments").replace("/", "--") + "-filtered.csv";
      a.click();
    });
    render();
  </script>
</body>
</html>
